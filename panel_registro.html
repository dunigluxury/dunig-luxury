<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'UNIG LUXURY - Confirmación de Pedido</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght=400;700;900&family=Plus+Jakarta+Sans:wght=200;300;400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050204; }
        .font-futurista { font-family: 'Orbitron', sans-serif; }
        .glow-gold { box-shadow: 0 0 25px rgba(229, 193, 88, 0.15); }
        .glass-checkout { background: linear-gradient(135deg, rgba(28, 20, 24, 0.45) 0%, rgba(12, 8, 10, 0.6) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.03); }
    </style>
</head>
<body class="text-stone-200 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full glass-checkout p-6 rounded-3xl shadow-2xl border border-stone-900 space-y-6">
        
        <!-- Alerta VIP superior -->
        <div class="text-stone-400 text-xs tracking-wide">
            <span class="text-amber-400 font-bold font-futurista uppercase">VIP.</span> Elige entrega prioritaria protegida al finalizar.
        </div>

        <!-- Sección de montos -->
        <div class="space-y-1">
            <div class="text-stone-400 text-sm">Subtotal (<span id="checkout-piezas" class="text-amber-400 font-bold">0</span> piezas):</div>
            <div class="text-4xl font-black text-white font-futurista tracking-wide">$0.00</div>
        </div>

        <!-- Formulario Checkout -->
        <div class="space-y-5">
            
            <!-- 1. Cuenta Destino -->
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-wider text-stone-400 block font-futurista">1. Cuenta Destino Colectora</label>
                <div class="relative">
                    <select id="checkout-cuenta" class="w-full bg-[#1c1418]/90 border border-stone-800 text-stone-300 text-xs p-4 rounded-xl focus:outline-none focus:border-amber-500/40 appearance-none cursor-pointer">
                        <option value="">— Seleccione una opción —</option>
                        <option value="pago_movil">Pago Móvil (Banesco)</option>
                        <option value="zelle">Zelle (Luxury Corp)</option>
                    </select>
                    <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-stone-500">
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </div>
                </div>
            </div>

            <!-- 2. Referencia -->
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-wider text-stone-400 block font-futurista">2. Referencia / Código de Depósito</label>
                <input type="text" id="checkout-referencia" placeholder="Ej: REF-77001" class="w-full bg-[#1c1418]/90 border border-stone-800 text-stone-300 text-xs p-4 rounded-xl focus:outline-none focus:border-amber-500/40 font-mono tracking-wide">
            </div>

            <!-- 3. CARGADOR DEL CAPTURE DE REFERENCIA (AGREGADO) -->
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-wider text-stone-400 block font-futurista">3. Adjuntar Capture de Pantalla</label>
                <div id="container-capture-pago" class="relative group border border-dashed border-stone-800 hover:border-amber-500/40 bg-[#1c1418]/50 rounded-xl transition-all overflow-hidden h-24 flex items-center justify-center">
                    
                    <!-- Estado Inicial / Vacío -->
                    <label id="label-upload-capture" class="w-full h-full flex flex-col items-center justify-center cursor-pointer text-[10px] text-stone-500 font-mono gap-1 group-hover:text-stone-300">
                        <i data-lucide="image-plus" class="w-5 h-5 text-stone-600 group-hover:text-amber-400 transition-colors"></i>
                        <span>SUBIR CAPTURE DE PAGO</span>
                        <input type="file" id="checkout-capture-file" accept="image/*" onchange="procesarCapturePago(event)" class="hidden">
                    </label>

                    <!-- Estado Cargado (Previsualización Oculta Inicialmente) -->
                    <div id="preview-capture-box" class="hidden absolute inset-0 w-full h-full bg-stone-950 flex items-center justify-between px-4">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-12 h-12 rounded-lg border border-stone-800 overflow-hidden bg-stone-900 shrink-0">
                                <img id="img-preview-capture" class="w-full h-full object-cover">
                            </div>
                            <div class="min-w-0">
                                <p class="text-[10px] text-stone-300 font-bold truncate">comprobante_cargado.jpg</p>
                                <p class="text-[9px] text-emerald-400 font-mono uppercase tracking-widest">Listo para checkout</p>
                            </div>
                        </div>
                        <button onclick="removerCapturePago()" class="p-2 text-red-400 hover:bg-stone-900 rounded-lg cursor-pointer transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>

                </div>
            </div>

            <!-- Botón de Envío / Checkout -->
            <button onclick="procesarCheckoutFinal()" class="w-full bg-[#e5c158] hover:bg-[#d4b047] text-black font-futurista font-black py-4 px-6 rounded-xl text-xs uppercase tracking-[0.15em] flex items-center justify-center gap-2 cursor-pointer transition-colors mt-2 shadow-lg shadow-amber-500/5">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                Proceed to Checkout
            </button>

        </div>
    </div>

    <script>
        // Almacén en Base64 para pasarlo directo en el payload a Supabase
        let captureBase64Global = "";

        // Procesa la imagen cargada por el cliente y genera un Base64 optimizado
        function procesarCapturePago(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Escalar imagen para optimizar espacio en Supabase
                    canvas.width = Math.min(600, img.width);
                    canvas.height = Math.min(600, img.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    captureBase64Global = canvas.toDataURL('image/jpeg', 0.6);

                    // Alternar vistas del contenedor
                    document.getElementById('img-preview-capture').src = captureBase64Global;
                    document.getElementById('label-upload-capture').classList.add('hidden');
                    document.getElementById('preview-capture-box').classList.remove('hidden');
                };
            };
            reader.readAsDataURL(file);
        }

        // Remueve la imagen del contenedor si el usuario se equivoca
        function removerCapturePago() {
            captureBase64Global = "";
            document.getElementById('checkout-capture-file').value = "";
            document.getElementById('label-upload-capture').classList.remove('hidden');
            document.getElementById('preview-capture-box').classList.add('hidden');
        }

        // Simulación de acción al presionar Proceed to Checkout
        function procesarCheckoutFinal() {
            const cuenta = document.getElementById('checkout-cuenta').value;
            const ref = document.getElementById('checkout-referencia').value.trim();

            if (!cuenta || !ref || !captureBase64Global) {
                alert("Por favor: Selecciona una cuenta, ingresa el número de referencia y adjunta el capture de pago.");
                return;
            }

            alert("Procesando orden VIP con capture adjunto de forma exitosa...");
            // Aquí integrarías tu llamada `.insert()` hacia la tabla de 'ordenes_vip' en Supabase
        }

        // Inicializar iconos de Lucide
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
