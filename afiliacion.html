<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afilia tu Negocio - Dunig Luxury</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="p-6 text-center border-b border-slate-800">
        <h1 class="text-2xl font-bold tracking-wider text-amber-400">DUNIG LUXURY</h1>
        <p class="text-xs text-slate-400 tracking-widest uppercase">Sistema de Menús Digitales y Ventas VIP</p>
    </header>

    <!-- Contenido Principal / Formulario de Afiliación -->
    <main class="flex-1 max-w-lg w-full mx-auto p-6 flex flex-col justify-center">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-semibold mb-2 text-center">Registra tu Comercio</h2>
            <p class="text-sm text-slate-400 mb-6 text-center">Únete a la plataforma y potencia tus ventas por WhatsApp.</p>

            <form id="form-afiliacion" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Nombre del Comercio / Negocio</label>
                    <input type="text" id="nombre_negocio" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" placeholder="Ej. Burger Luxury">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Usuario de Instagram (Sin @)</label>
                    <input type="text" id="instagram_dueno" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" placeholder="Ej. burgerluxury">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" placeholder="tucorreo@gmail.com">
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-lg transition duration-200 mt-4">
                    Solicitar Afiliación
                </button>
            </form>

            <div id="mensaje-alerta" class="mt-4 text-center text-sm hidden"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-xs text-slate-500 border-t border-slate-800">
        &copy; 2026 Dunig Luxury. Todos los derechos reservados.
    </footer>

    <!-- Lógica de Conexión con Supabase -->
    <script>
        // CONFIGURA TUS CREDENCIALES DE SUPABASE AQUÍ
        const SUPABASE_URL = 'https://yoibmpulvokhvvhkryzv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJtcHVsdm9raHZ2aGtyeXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDgwODQsImV4cCI6MjA5ODA4NDA4NH0.cNq3eZzXyB7kqdsyqf3ctKsYO5x1ABo20hgFeJdyzBE';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('form-afiliacion');
        const mensajeAlerta = document.getElementById('mensaje-alerta');
        const btnSubmit = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Enviando solicitud...";
            mensajeAlerta.classList.add('hidden');

            const nombreNegocio = document.getElementById('nombre_negocio').value.trim();
            const instagramDueno = document.getElementById('instagram_dueno').value.trim().toLowerCase();
            const email = document.getElementById('email').value.trim();

            try {
                // Guardar los datos del comercio directamente en la tabla 'comercios'
                const { error: dbError } = await supabaseClient
                    .from('comercios')
                    .insert([
                        { 
                            nombre_negocio: nombreNegocio,
                            instagram_dueno: instagramDueno,
                            email: email
                        }
                    ]);

                if (dbError) throw dbError;

                mensajeAlerta.textContent = "¡Solicitud enviada con éxito! Nos pondremos en contacto contigo.";
                mensajeAlerta.className = "mt-4 text-center text-sm text-green-400 font-medium";
                mensajeAlerta.classList.remove('hidden');

                form.reset();
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Solicitar Afiliación";

            } catch (error) {
                console.error("Error en el registro:", error.message);
                mensajeAlerta.textContent = "Error: " + error.message;
                mensajeAlerta.className = "mt-4 text-center text-sm text-red-400 font-medium";
                mensajeAlerta.classList.remove('hidden');
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Solicitar Afiliación";
            }
        });
    </script>
</body>
</html>
