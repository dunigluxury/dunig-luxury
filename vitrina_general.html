<!DOCTYPE html>

    <div id="contenedor" class="grid grid-cols-2 gap-4">
        <!-- Las imágenes aparecerán aquí -->

    <script>
        const supabase = supabase.createClient('https://yoibmpulvokhvvhkryzv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJtcHVsdm9raHZ2aGtyeXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDgwODQsImV4cCI6MjA5ODA4NDA4NH0.cNq3eZzXyB7kqdsyqf3ctKsYO5x1ABo20hgFeJdyzBE');

        async function cargar() {
            // Traemos solo lo que necesitamos
            const { data } = await supabase.from('links_vitrinas').select('url, imagen_url');

            const cont = document.getElementById('contenedor');
            
            // Dibujamos directo
            cont.innerHTML = data.map(item => `
                <a href="${item.url}" target="_blank">
                    <img src="${item.imagen_url}" class="rounded-lg w-full">
                </a>
            `).join('');
        }

        cargar();
    </script>
</body>
