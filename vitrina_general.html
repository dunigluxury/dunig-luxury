<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dunig Luxury - Vitrinas</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase SDK para conectar a la base de datos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-950 text-white min-h-screen">

    <header class="p-8 text-center">
        <h1 class="text-2xl font-bold uppercase tracking-widest text-amber-500">Dunig Luxury</h1>
        <p class="text-stone-400 text-xs mt-2 uppercase">Selecciona un comercio</p>
    </header>

    <!-- Contenedor principal donde saldrán los negocios -->
    <div id="contenedor-comercios" class="grid grid-cols-2 md:grid-cols-4 gap-6 p-6 max-w-5xl mx-auto">
        <!-- Los logos se cargan aquí -->
    </div>

    <script>
        // 1. CONFIGURACIÓN: Aquí pegas tus credenciales de Supabase
        const supabaseUrl = 'https://yoibmpulvokhvvhkryzv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJtcHVsdm9raHZ2aGtyeXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDgwODQsImV4cCI6MjA5ODA4NDA4NH0.cNq3eZzXyB7kqdsyqf3ctKsYO5x1ABo20hgFeJdyzBE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. LÓGICA DE CARGA
        async function cargarComercios() {
            const contenedor = document.getElementById('contenedor-comercios');
            
            const { data, error } = await supabaseClient
                .from('links_vitrinas')
                .select('nombre, url, imagen_url');

            if (error) {
                console.error("Error al conectar:", error);
                return;
            }

            if (data && data.length > 0) {
                contenedor.innerHTML = data.map(n => `
                    <a href="${n.url}" target="_blank" class="block bg-stone-900 border border-stone-800 rounded-2xl overflow-hidden hover:border-amber-500 transition-all hover:scale-105">
                        <img src="${n.imagen_url}" alt="${n.nombre}" class="w-full h-32 object-cover">
                        <div class="p-3 text-center text-xs font-bold uppercase">${n.nombre}</div>
                    </a>
                `).join('');
            }
        }

        cargarComercios();
    </script>
</body>
</html>
