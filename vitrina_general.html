<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dunig Luxury - Vitrinas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-950 text-white min-h-screen">

    <header class="p-8 text-center">
        <h1 class="text-2xl font-bold uppercase tracking-widest text-amber-500">Dunig Luxury</h1>
        <p class="text-stone-400 text-xs mt-2 uppercase">Selecciona un comercio</p>
    </header>

    <!-- Buscador -->
    <div class="max-w-md mx-auto px-6 mb-8">
        <input type="text" id="buscador" placeholder="🔍 Buscar comercio..." 
               onkeyup="filtrarComercios()"
               class="w-full bg-stone-900 border border-stone-800 p-4 rounded-2xl text-white outline-none focus:border-amber-500 transition-all">
    </div>

    <!-- Contenedor principal -->
    <div id="contenedor-comercios" class="grid grid-cols-2 md:grid-cols-4 gap-6 p-6 max-w-5xl mx-auto">
        <!-- Indicador de carga -->
        <p id="cargando" class="col-span-full text-center text-stone-500">Cargando vitrinas...</p>
    </div>

    <script>
        // CONFIGURACIÓN
const supabaseUrl = 'https://yoibmpulvokhvvhkryzv.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJtcHVsdm9raHZ2aGtyeXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDgwODQsImV4cCI6MjA5ODA4NDA4NH0.cNq3eZzXyB7kqdsyqf3ctKsYO5x1ABo20hgFeJdyzBE';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function cargarComerciosPorId(idBuscado) {
    // 1. Realizamos la consulta filtrando específicamente por el ID
    const { data, error } = await supabaseClient
        .from('links_vitrinas')
        .select('*')
        .eq('id', idBuscado); // Este es el filtro por ID

    if (error) {
        console.error("Error al buscar por ID:", error.message);
        alert("Error al cargar el comercio.");
        return;
    }

    // 2. Verificamos si existe el ID
    if (data && data.length > 0) {
        console.log("Comercio encontrado:", data[0]);
        renderizar(data); // Tu función que muestra la imagen/link en pantalla
    } else {
        alert("No se encontró ningún comercio con el ID: " + idBuscado);
    }
}

// Ejemplo de uso: Si quieres cargar el comercio con ID 20:
// cargarComerciosPorId(20);
        // LÓGICA DE FILTRADO
        function filtrarComercios() {
            const busqueda = document.getElementById('buscador').value.toLowerCase();
            const filtrados = todosLosNegocios.filter(n => 
                n.nombre.toLowerCase().includes(busqueda)
            );
            renderizar(filtrados);
        }

        // LÓGICA DE DIBUJO - FINAL
function renderizar(lista) {
    const contenedor = document.getElementById('contenedor-comercios');
    if (lista.length === 0) {
        contenedor.innerHTML = '<p class="col-span-full text-center text-stone-500">No hay comercios.</p>';
        return;
    }

    contenedor.innerHTML = lista.map(n => `
        <a href="${n.url}" target="_blank" class="block bg-stone-900 border border-stone-800 rounded-2xl overflow-hidden hover:border-amber-500 transition-all hover:scale-105 shadow-lg">
            <div class="w-full h-32 bg-stone-800 flex items-center justify-center overflow-hidden">
                <img src="${n.imagen_url}" alt="${n.nombre}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="text-stone-600 text-xs" style="display:none;">Sin imagen</span>
            </div>
            <div class="p-3 text-center text-xs font-bold uppercase truncate">${n.nombre}</div>
        </a>
    `).join('');
}

        // Iniciar
        cargarComercios();
    </script>
</body>
</html>
