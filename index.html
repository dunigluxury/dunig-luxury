<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendaval House - Cálculo de Delivery GPS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-black text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="glass-panel p-6 rounded-2xl max-w-md w-full text-center border border-white/10 bg-zinc-900/80 shadow-2xl">
        <h1 class="text-xl font-bold mb-4">Calculadora de Delivery</h1>
        <p class="text-sm text-zinc-400 mb-6">Obtén el valor exacto de tu envío usando el GPS de tu dispositivo sin mapas en pantalla.</p>
        <button onclick="obtenerUbicacionGPSDirecta()" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-center gap-2">
            <i data-lucide="navigation"></i> Calcular Delivery por GPS
        </button>
    </div>

    <div id="modalCargaGPS" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-amber-500/30 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
            <img id="gifAnimadoCarga" src="https://i.giphy.com/media/l3vR4CdLInXOhr3rO/giphy.gif" alt="Cargando ubicación..." class="w-24 h-24 mx-auto mb-4 rounded-full object-cover border-2 border-amber-500/50">
            <h3 class="text-lg font-bold text-amber-400 mb-1">Obteniendo GPS...</h3>
            <p id="textoEstadoCarga" class="text-xs text-zinc-400">Por favor, permite el acceso a tu ubicación en el navegador.</p>
        </div>
    </div>

    <script>
        // ================= CONFIGURACIÓN =================
        const LOCAL_LAT = 8.59941369535553;  // Coordenada fija de tu local
        const LOCAL_LNG = -71.14089323410698;
        const TARIFA_POR_KM = 0.80;          // Tarifa configurable por kilómetro
        
        // Puedes cambiar esta URL por el enlace directo de cualquier GIF animado de tu preferencia
        const URL_GIF_CARGANDO = "https://i.giphy.com/media/l3vR4CdLInXOhr3rO/giphy.gif";
        // =================================================

        // Función principal para iniciar la captura de ubicación
        function obtenerUbicacionGPSDirecta() {
            // Mostrar modal con GIF animado
            const modal = document.getElementById('modalCargaGPS');
            const imgGif = document.getElementById('gifAnimadoCarga');
            const textoEstado = document.getElementById('textoEstadoCarga');

            imgGif.src = URL_GIF_CARGANDO;
            textoEstado.innerText = "Buscando coordenadas satelitales...";
            modal.classList.remove('hidden');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const latCliente = position.coords.latitude;
                        const lngCliente = position.coords.longitude;
                        
                        // Ocultar modal al completar con éxito
                        modal.classList.add('hidden');

                        // Una vez obtenidas las coordenadas, calculas el delivery automáticamente
                        const resultadoDelivery = calcularDeliverySinMapa(latCliente, lngCliente);
                        
                        // Ejemplo de uso del resultado obtenido
                        alert(`¡Ubicación calculada con éxito!\n\nDistancia: ${resultadoDelivery.distancia} km\nCosto Delivery: $${resultadoDelivery.costo}`);
                    },
                    (error) => {
                        modal.classList.add('hidden');
                        alert("No se pudo obtener la ubicación GPS. Verifica los permisos de tu dispositivo.");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                modal.classList.add('hidden');
                alert("Tu navegador no soporta geolocalización.");
            }
        }

        // Fórmula matemática de Haversine para la distancia
        function calcularDistanciaEnKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radio de la tierra en km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + 
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // Función para procesar costos y generar enlace de texto
        function calcularDeliverySinMapa(latCliente, lngCliente) {
            // 1. Calcular distancia
            const distanciaKm = calcularDistanciaEnKm(LOCAL_LAT, LOCAL_LNG, latCliente, lngCliente);
            
            // 2. Calcular costo basado en kilómetros
            let costoDelivery = distanciaKm * TARIFA_POR_KM;
            
            // Aplicar reglas mínimas
            if (costoDelivery < 1.00 && distanciaKm > 0.1) costoDelivery = 1.00;
            if (distanciaKm <= 0.1) costoDelivery = 0.00;

            costoDelivery = parseFloat(costoDelivery.toFixed(2));

            console.log(`Distancia: ${distanciaKm.toFixed(2)} km`);
            console.log(`Costo de Delivery: $${costoDelivery}`);

            // 3. Generar el enlace de coordenadas para enviar por WhatsApp o guardar en Base de Datos
            const linkGoogleMaps = `https://maps.google.com/?q=${latCliente},${lngCliente}`;
            
            return {
                distancia: distanciaKm.toFixed(2),
                costo: costoDelivery,
                enlaceMaps: linkGoogleMaps
            };
        }

        // Inicializar iconos
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
