<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendaval House - Google Maps & Delivery</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-neutral-900 text-white font-sans overflow-hidden">

  <!-- Contenedor Principal en Pantalla Completa -->
  <div class="relative w-screen h-screen overflow-hidden">
    
    <!-- 1. El Mapa Oficial de Google Maps (Iframe interactivo centrado en Vendaval House) -->
    <div class="absolute inset-0 w-full h-full z-0">
      <iframe 
        class="w-full h-full border-0 filter grayscale-20 contrast-125"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3975.5!2d-71.1565!3d8.5896!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zOMKwMzUnMjIuNiJOIDcxwrA5JzIzLjQiVw!5e0!3m2!1ses!2sve!4v1st0000000000" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <!-- 2. Barra de Búsqueda Flotante Superior -->
    <div class="absolute top-4 left-4 right-4 z-10 flex items-center bg-neutral-900/90 backdrop-blur-md rounded-2xl shadow-xl px-4 py-3 border border-neutral-800">
      <svg class="w-5 h-5 text-neutral-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <input type="text" placeholder="Vendaval House - Sistema de Delivery" class="bg-transparent w-full focus:outline-none text-sm text-white placeholder-neutral-500" disabled>
    </div>

    <!-- 3. Botón Flotante para Calcular Distancia GPS -->
    <div class="absolute right-4 bottom-48 z-10 flex flex-col space-y-3">
      <button onclick="calculateDelivery()" class="bg-neutral-900/95 hover:bg-neutral-800 p-3.5 rounded-full shadow-2xl backdrop-blur-md border border-neutral-800 text-emerald-400 transition flex items-center justify-center cursor-pointer" title="Calcular mi distancia">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>

    <!-- 4. Panel Inferior Flotante (BottomSheet Estilo WhatsApp con los cálculos) -->
    <div class="absolute bottom-0 left-0 right-0 z-20 bg-neutral-900/95 backdrop-blur-2xl rounded-t-3xl p-5 shadow-[0_-10px_25px_rgba(0,0,0,0.5)] border-t border-neutral-800 max-h-[48vh] overflow-y-auto">
      <!-- Indicador visual de arrastre -->
      <div class="w-12 h-1.5 bg-neutral-700 rounded-full mx-auto mb-4"></div>
      
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-base font-semibold text-white">Vendaval House</h3>
        <span class="text-xs bg-neutral-800 border border-neutral-700/50 px-2.5 py-1 rounded-full text-emerald-400">Google Maps Activo</span>
      </div>

      <!-- Contenedor de Resultados del Delivery -->
      <div class="space-y-3">
        
        <!-- Tarjeta de Desglose -->
        <div class="p-4 bg-neutral-800/80 rounded-2xl border border-neutral-700/60 space-y-2">
          <div class="flex justify-between text-sm">
            <span class="text-neutral-400">Distancia estimada:</span>
            <span id="distance-text" class="font-semibold text-white">Presiona el botón 📍 para ubicarte</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-neutral-400">Costo del Delivery:</span>
            <span id="delivery-cost" class="font-bold text-emerald-400">$0.00</span>
          </div>
        </div>

        <!-- Botón para Pedir por WhatsApp -->
        <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg cursor-pointer">
          <span>Pedir por WhatsApp con este Delivery</span>
        </button>

        <!-- Enlace secundario para abrir la app oficial de Google Maps si desean ver la ruta visual completa -->
        <a href="https://maps.app.goo.gl/z2Xu7wMuJWQpCr2W6?g_st=ac" target="_blank" class="block text-center text-xs text-neutral-400 hover:text-white underline pt-1">
          Abrir ruta completa en la app de Google Maps
        </a>
      </div>
    </div>

  </div>

  <script>
    // Coordenadas fijas de referencia de Vendaval House en Mérida
    const VENDAVAL_LAT = 8.5896;
    const VENDAVAL_LNG = -71.1565;
    
    // Tarifa configurada por cada kilómetro recorrido ($1.50 por km, puedes cambiarlo a tu gusto)
    const COSTO_POR_KM = 1.50; 

    let calculatedDistance = 0;
    let calculatedTotalCost = 0;

    // Fórmula matemática de Haversine para calcular distancia exacta en km
    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radio de la tierra en km
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Función que activa el GPS del cliente y calcula automáticamente los montos
    function calculateDelivery() {
      if (navigator.geolocation) {
        document.getElementById('distance-text').innerText = "Obteniendo GPS...";
        
        navigator.geolocation.getCurrentPosition((position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          // Calcular distancia en base a Vendaval House
          calculatedDistance = getDistanceFromLatLonInKm(VENDAVAL_LAT, VENDAVAL_LNG, userLat, userLng);
          
          // Calcular precio total del envío
          calculatedTotalCost = calculatedDistance * COSTO_POR_KM;

          // Actualizar la interfaz visual
          document.getElementById('distance-text').innerText = `${calculatedDistance.toFixed(2)} km`;
          document.getElementById('delivery-cost').innerText = `$${calculatedTotalCost.toFixed(2)} USD`;

        }, (error) => {
          alert("No se pudo obtener tu ubicación. Verifica los permisos de tu navegador.");
          document.getElementById('distance-text').innerText = "Error al obtener GPS";
        }, { enableHighAccuracy: true });
      } else {
        alert("Tu navegador no soporta geolocalización.");
      }
    }

    // Enviar la orden completa con el cálculo a tu WhatsApp
    function sendToWhatsApp() {
      const phoneNumber = "584120000000"; // Reemplaza con tu número de teléfono de pedidos
      const message = `¡Hola! 👋 Deseo pedir en *Vendaval House*.%0A📍 Distancia calculada: *${calculatedDistance.toFixed(2)} km*.%0A🛵 Costo de delivery: *$${calculatedTotalCost.toFixed(2)} USD*.%0A¿Me confirman para avanzar?`;
      
      window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
    }
  </script>
</body>
</html>
