<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dunig Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-950 text-white p-6">
    <div class="max-w-md mx-auto bg-stone-900 p-6 rounded-xl border border-stone-800">
        <h2 class="text-xl font-bold mb-4 text-amber-500">Nuevo Comercio</h2>
        
        <input id="nombre" type="text" placeholder="Nombre del negocio" class="w-full p-2 mb-3 bg-stone-800 rounded text-white border border-stone-700">
        <input id="url" type="text" placeholder="URL de la vitrina" class="w-full p-2 mb-3 bg-stone-800 rounded text-white border border-stone-700">
        
        <label class="block mb-2 text-sm text-stone-400">Seleccionar imagen:</label>
        <div class="relative w-full h-12 bg-stone-800 rounded flex items-center justify-center border-2 border-dashed border-stone-700 mb-6">
            <span id="fileText" class="text-stone-500 text-sm">Toca para elegir imagen</span>
            <input id="fileInput" type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
        </div>

        <button id="btnGuardar" class="w-full bg-amber-600 p-2 rounded font-bold hover:bg-amber-500 transition-colors">Guardar Comercio</button>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            'https://yoibmpulvokhvvhkryzv.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJtcHVsdm9raHZ2aGtyeXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDgwODQsImV4cCI6MjA5ODA4NDA4NH0.cNq3eZzXyB7kqdsyqf3ctKsYO5x1ABo20hgFeJdyzBE'
        );

        // Feedback visual al seleccionar archivo
        document.getElementById('fileInput').onchange = (e) => {
            if (e.target.files.length > 0) {
                document.getElementById('fileText').innerText = e.target.files[0].name;
            }
        };

        document.getElementById('btnGuardar').onclick = async () => {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const nombre = document.getElementById('nombre').value;
            const url = document.getElementById('url').value;

            if (!file || !nombre || !url) {
                alert("Error: Por favor completa todos los campos y elige una imagen.");
                return;
            }

            try {
                // 1. Subir imagen
                const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
                
                const { error: uploadError } = await supabaseClient.storage
                    .from('vitrinas')
                    .upload(fileName, file);

                if (uploadError) throw new Error("Storage: " + uploadError.message);

                // 2. Obtener URL
                const { data: publicUrlData } = supabaseClient.storage
                    .from('vitrinas')
                    .getPublicUrl(fileName);

                // 3. Insertar en tabla
                const { error: dbError } = await supabaseClient
                    .from('links_vitrinas')
                    .insert([{ nombre, url, imagen_url: publicUrlData.publicUrl }]);

                if (dbError) throw new Error("Base de datos: " + dbError.message);

                alert("¡Éxito! Comercio guardado correctamente.");
                
                // Limpiar formulario
                document.getElementById('nombre').value = '';
                document.getElementById('url').value = '';
                fileInput.value = '';
                document.getElementById('fileText').innerText = 'Toca para elegir imagen';

            } catch (err) {
                console.error(err);
                alert("Ocurrió un error: " + err.message);
            }
        };
    </script>
</body>
</html>
