<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dunig Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-950 text-white p-4">

    <!-- Formulario a ancho completo -->
    <div class="w-full bg-stone-900 p-6 rounded-xl border border-stone-800 mb-8">
        <h2 class="text-xl font-bold mb-4 text-amber-500">Nuevo Comercio</h2>
        <input id="nombre" type="text" placeholder="Nombre" class="w-full p-3 mb-3 bg-stone-800 rounded border border-stone-700">
        <input id="url" type="text" placeholder="URL" class="w-full p-3 mb-3 bg-stone-800 rounded border border-stone-700">
        <label class="block mb-2 text-sm text-stone-400">Seleccionar imagen:</label>
        <input id="fileInput" type="file" accept="image/*" class="w-full mb-4 text-sm">
        <button id="btnGuardar" class="w-full bg-amber-600 p-3 rounded font-bold hover:bg-amber-500 transition">Guardar Comercio</button>
    </div>

    <!-- Lista a ancho completo -->
    <div id="listaComercios" class="w-full space-y-4">
        <h2 class="text-xl font-bold text-white mb-4">Tus Comercios Registrados</h2>
        <!-- Aquí se cargarán los elementos -->
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://yoibmpulvokhvvhkryzv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJtcHVsdm9raHZ2aGtyeXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDgwODQsImV4cCI6MjA5ODA4NDA4NH0.cNq3eZzXyB7kqdsyqf3ctKsYO5x1ABo20hgFeJdyzBE');

        async function cargarLista() {
            const { data, error } = await supabaseClient.from('links_vitrinas').select('*');
            const container = document.getElementById('listaComercios');
            container.innerHTML = '<h2 class="text-xl font-bold text-white mb-4">Tus Comercios Registrados</h2>';

            if (error) {
                console.error("Error al cargar:", error);
                return;
            }

            if (data) {
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="w-full bg-stone-900 p-4 rounded border border-stone-800 flex justify-between items-center hover:border-amber-600 transition">
                            <span class="font-semibold">${item.nombre}</span>
                            <button onclick="borrar(${item.id})" class="bg-red-900/30 text-red-400 px-4 py-2 rounded hover:bg-red-800 transition">
                                Borrar
                            </button>
                        </div>
                    `;
                });
            }
        }

        async function borrar(id) {
            if (!confirm("¿Seguro que quieres borrar este comercio?")) return;
            
            const { error } = await supabaseClient.from('links_vitrinas').delete().eq('id', id);
            
            if (error) {
                alert("Error al borrar: " + error.message);
            } else {
                alert("Eliminado con éxito");
                cargarLista();
            }
        }

        document.getElementById('btnGuardar').onclick = async () => {
            const file = document.getElementById('fileInput').files[0];
            const nombre = document.getElementById('nombre').value;
            const url = document.getElementById('url').value;

            if (!file || !nombre) { alert("Por favor, llena todos los campos y selecciona una imagen"); return; }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const { error } = await supabaseClient.from('links_vitrinas').insert([{ 
                    nombre, url, imagen_url: reader.result 
                }]);
                
                if (error) {
                    alert("Error al guardar: " + error.message);
                } else {
                    alert("¡Guardado correctamente!");
                    document.getElementById('nombre').value = '';
                    document.getElementById('url').value = '';
                    cargarLista();
                }
            };
        };

        cargarLista();
    </script>
</body>
</html>
