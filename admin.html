<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dunig Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-950 text-white p-4">

    <!-- Formulario -->
    <div class="w-full max-w-lg mx-auto bg-stone-900 p-6 rounded-xl border border-stone-800 mb-8">
        <h2 class="text-xl font-bold mb-4 text-amber-500">Nuevo Comercio</h2>
        <input id="nombre" type="text" placeholder="Nombre del Comercio" class="w-full p-3 mb-3 bg-stone-800 rounded border border-stone-700">
        <input id="url" type="text" placeholder="URL de destino" class="w-full p-3 mb-3 bg-stone-800 rounded border border-stone-700">
        <label class="block mb-2 text-sm text-stone-400">Seleccionar imagen:</label>
        <input id="fileInput" type="file" accept="image/*" class="w-full mb-4 text-sm">
        <button id="btnGuardar" class="w-full bg-amber-600 p-3 rounded font-bold hover:bg-amber-500 transition">Guardar Comercio</button>
    </div>

    <!-- Lista -->
    <div id="listaComercios" class="w-full max-w-lg mx-auto space-y-4">
        <h2 class="text-xl font-bold text-white mb-4">Comercios Registrados</h2>
        <div id="loading" class="text-stone-500 text-center">Cargando datos...</div>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://yoibmpulvokhvvhkryzv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJtcHVsdm9raHZ2aGtyeXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDgwODQsImV4cCI6MjA5ODA4NDA4NH0.cNq3eZzXyB7kqdsyqf3ctKsYO5x1ABo20hgFeJdyzBE');

        async function cargarLista() {
            const container = document.getElementById('listaComercios');
            const { data, error } = await supabaseClient.from('links_vitrinas').select('*');
            
            document.getElementById('loading').style.display = 'none';

            if (error) {
                console.error("Error al cargar:", error);
                return;
            }

            container.innerHTML = '<h2 class="text-xl font-bold text-white mb-4">Comercios Registrados</h2>';
            
            if (data && data.length > 0) {
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="bg-stone-900 p-4 rounded border border-stone-800 flex justify-between items-center">
                            <span class="font-semibold truncate mr-2">${item.nombre}</span>
                            <button onclick="borrar(${item.id})" class="bg-red-900/30 text-red-400 px-4 py-2 rounded text-sm hover:bg-red-800 transition">
                                Borrar
                            </button>
                        </div>
                    `;
                });
            } else {
                container.innerHTML += '<p class="text-stone-600">No hay comercios registrados.</p>';
            }
        }

        async function borrar(id) {
    // 1. Confirmación de seguridad
    if (!confirm("¿Seguro que quieres borrar este elemento con ID: " + id + "?")) return;
    
    // 2. Aseguramos que el ID sea un número (si tu columna ID es de tipo int)
    const idFinal = parseInt(id);
    
    console.log("Intentando borrar ID:", idFinal);

    // 3. Ejecutamos la eliminación usando .eq que es el estándar recomendado para IDs
    const { error } = await supabaseClient
        .from('links_vitrinas')
        .delete()
        .eq('id', idFinal); // Usamos .eq directamente sobre el ID convertido a entero
    
    // 4. Manejo de resultados
    if (error) {
        console.error("Error técnico:", error);
        alert("Error al borrar: " + error.message);
    } else {
        alert("¡Eliminado correctamente!");
        // Refrescamos la lista para ver el cambio inmediatamente
        await cargarLista();
    }
}

        document.getElementById('btnGuardar').onclick = async () => {
    const btn = document.getElementById('btnGuardar');
    const file = document.getElementById('fileInput').files[0];
    const nombre = document.getElementById('nombre').value.trim();
    const url = document.getElementById('url').value.trim();

    // 1. Validación estricta
    if (!file || !nombre || !url) { 
        alert("Por favor, llena todos los campos y selecciona una imagen"); 
        return; 
    }

    // 2. Desactivar botón para evitar envíos múltiples
    btn.disabled = true;
    btn.innerText = "Guardando...";

    const reader = new FileReader();
    reader.readAsDataURL(file);
    
    reader.onload = async () => {
        const { error } = await supabaseClient.from('links_vitrinas').insert([{ 
            nombre, 
            url, 
            imagen_url: reader.result 
        }]);
        
        // 3. Reactivar botón después de la respuesta
        btn.disabled = false;
        btn.innerText = "Guardar Comercio";

        if (error) {
            alert("Error al guardar: " + error.message);
        } else {
            alert("¡Guardado correctamente!");
            // Limpieza de campos
            document.getElementById('nombre').value = '';
            document.getElementById('url').value = '';
            document.getElementById('fileInput').value = '';
            // Recargar lista
            await cargarLista();
        }
    };
    
    reader.onerror = () => {
        btn.disabled = false;
        btn.innerText = "Guardar Comercio";
        alert("Error al leer la imagen.");
    };
};

        cargarLista();
    </script>
</body>
</html>
