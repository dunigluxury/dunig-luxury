<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Dunig Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-950 text-white p-6">
    <div class="max-w-md mx-auto bg-stone-900 p-6 rounded-xl border border-stone-800">
        <h2 class="text-xl font-bold mb-4 text-amber-500">Nuevo Comercio</h2>
        <input id="nombre" type="text" placeholder="Nombre del negocio" class="w-full p-2 mb-3 bg-stone-800 rounded">
        <input id="url" type="text" placeholder="URL de la vitrina" class="w-full p-2 mb-3 bg-stone-800 rounded">
        <input id="imagen" type="text" placeholder="URL de la imagen" class="w-full p-2 mb-3 bg-stone-800 rounded">
        <button onclick="guardarComercio()" class="w-full bg-amber-600 p-2 rounded font-bold hover:bg-amber-500">Guardar Comercio</button>
    </div>

    <script>
        const supabase = supabase.createClient('https://yoibmpulvokhvvhkryzv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJtcHVsdm9raHZ2aGtyeXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1MDgwODQsImV4cCI6MjA5ODA4NDA4NH0.cNq3eZzXyB7kqdsyqf3ctKsYO5x1ABo20hgFeJdyzBE');

        async function guardarComercio() {
            const nombre = document.getElementById('nombre').value;
            const url = document.getElementById('url').value;
            const imagen = document.getElementById('imagen').value;

            const { error } = await supabase.from('links_vitrinas').insert([{ nombre, url, imagen_url: imagen }]);
            
            if (error) alert("Error: " + error.message);
            else alert("¡Comercio guardado con éxito!");
        }
    </script>
</body>
</html>
